<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 58" fill="none" role="img" aria-label="Gauntlet: red team versus blue team boxing gloves">
  <!-- RED glove (facing right) -->
  <g>
    <rect x="4" y="15" width="18" height="28" rx="6" fill="#c81e1e"/>
    <rect x="4" y="21" width="18" height="3.5" fill="#ec5555"/>
    <rect x="4" y="33" width="18" height="3.5" fill="#ec5555"/>
    <circle cx="30" cy="43" r="8" fill="#e23b3b"/>
    <circle cx="43" cy="28" r="19" fill="#e23b3b"/>
    <ellipse cx="40" cy="17" rx="9" ry="4.5" fill="#ffffff" opacity="0.28"/>
    <path d="M57 17 Q63 28 57 39" stroke="#a81616" stroke-width="2.2" fill="none" opacity="0.55" stroke-linecap="round"/>
  </g>
  <!-- BLUE glove (facing left) -->
  <g transform="translate(128,0) scale(-1,1)">
    <rect x="4" y="15" width="18" height="28" rx="6" fill="#1e50c8"/>
    <rect x="4" y="21" width="18" height="3.5" fill="#5b83f0"/>
    <rect x="4" y="33" width="18" height="3.5" fill="#5b83f0"/>
    <circle cx="30" cy="43" r="8" fill="#2f6fed"/>
    <circle cx="43" cy="28" r="19" fill="#2f6fed"/>
    <ellipse cx="40" cy="17" rx="9" ry="4.5" fill="#ffffff" opacity="0.28"/>
    <path d="M57 17 Q63 28 57 39" stroke="#173a94" stroke-width="2.2" fill="none" opacity="0.55" stroke-linecap="round"/>
  </g>
</svg>
